services:
  - type: web
    name: forma-fitness
    runtime: node
    buildCommand: npm install && npm run check && npm test
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_DB_NAME
        value: 'Diet&Fitness'
      - key: MONGO_URI
        sync: false
      - key: APP_PASSWORD
        sync: false
